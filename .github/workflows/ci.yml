name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet format Dossier.Server/Dossier.Server.csproj --verify-no-changes --severity warn
      - run: dotnet format Dossier.Server.Tests/Dossier.Server.Tests.csproj --verify-no-changes --severity warn
      - run: dotnet test Dossier.Server.Tests/Dossier.Server.Tests.csproj --configuration Release
      - run: dotnet publish Dossier.Server/Dossier.Server.csproj --configuration Release --output publish
