name: Format, Build, Test

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet tool restore
      - run: dotnet csharpier check .
      - run: dotnet build Dossier.csproj --configuration Release -warnaserror
      - run: dotnet test Dossier.Tests/Dossier.Tests.csproj --configuration Release
      - run: dotnet publish Dossier.csproj --configuration Release --output publish
